<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SpaceHub</title>
</head>
<body>
    <nav class="topbar" aria-label="Main navigation">
        <span class="brand">SpaceHub</span>
    </nav>

    <main class="title">
     
        <section class="newest_countdown" aria-labelledby="launch-name">
            <p class="eyebrow">NEXT LAUNCH</p>
            <img id="launch-image" class="launch-image" alt="" hidden>
            <h1 id="launch-name">Loading launch...</h1>
            <p id="launch-company" class="launch-company"></p>
            <p class="countdown-label">Launching in</p>
            <p id="countdown" class="countdown"></p>
            <button id="retry-button" class="retry-button" hidden>
                Try again
            </button>
           <button id="live-button" class="live-button">● Watch live</button> 
        </section>
        

        <section class="launch-board" aria-labelledby="board-title">
            <div class="board-heading">
                <h2 id="board-title">UPCOMING DEPARTURES</h2>
                
            </div>
            <div class="board-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Flight</th>
                            <th>Operator</th>
                            <th>T-0 (UTC)</th>
                            <th>Countdown</th>
                        </tr>

                    </thead>
                    <tbody id="launch-list">
                        <tr>
                            <td colspan="4">Loading launches...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
